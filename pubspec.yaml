name: chat_app
description: "Chat Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  riverpod: ^3.0.3
  flutter_riverpod: ^3.1.0
  go_router: ^17.1.0
  flutter_secure_storage: ^10.3.1
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.4
  riverpod_generator: ^4.0.0+1
  google_fonts: ^8.0.2
  freezed_annotation: ^3.1.0
  carousel_slider: ^5.1.2
  intl: ^0.20.2
  envied: ^1.3.5
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.5
  toastification: ^3.2.0
  dotted_border: ^3.1.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.3
  build_runner: ^2.13.1
  freezed: ^3.2.3
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0
  envied_generator: ^1.3.5

flutter_native_splash:
  image: './assets/app_logos/chat_app.png'
  color: "#ffffff"

  android_12:
    image: './assets/app_logos/chat_app.png'
    color: "#ffffff"

  ios_content_mode: center
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/app_logos/
    - assets/app_icons/
    - assets/app_illustrations/
